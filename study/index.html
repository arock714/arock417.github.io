<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study & Exam Tracker | Eric Melendez</title>

    <!-- Cross-platform Carlito / Calibri font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #121214;
            --card-bg: #1e1e22;
            --border: #2e2e36;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-cyan: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-purple: #a78bfa;
            --input-bg: #141416;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Carlito', Calibri, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 950px;
            margin: 0 auto;
            padding: 24px 16px;
            line-height: 1.5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-cyan);
        }

        header a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
        }

        header a:hover {
            color: var(--accent-cyan);
        }

        .token-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 16px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text);
        }

        .timer-display {
            text-align: center;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .timer-time {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        select, input[type="password"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        select {
            margin-bottom: 12px;
        }

        button {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-green { background: var(--accent-green); color: #000; }
        .btn-red { background: var(--accent-red); color: #000; }
        .btn-purple { background: var(--accent-purple); color: #000; }

        .list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .item-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .countdown-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* Chart Styling */
        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 160px;
            padding-top: 24px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .chart-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .chart-bar {
            width: 100%;
            max-width: 36px;
            background: var(--accent-cyan);
            border-radius: 4px 4px 0 0;
            transition: height 0.4s ease, background-color 0.2s;
            min-height: 4px;
