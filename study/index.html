<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study & Exam Tracker | Eric Melendez</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #121214;
            --card-bg: #1e1e22;
            --border: #2e2e36;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-cyan: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --input-bg: #141416;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Carlito', Calibri, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px;
            line-height: 1.5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.5rem; color: var(--accent-cyan); }
        header a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        header a:hover { color: var(--accent-cyan); }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text);
        }

        .timer-display {
            text-align: center;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .timer-time {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        button {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-green { background: var(--accent-green); color: #000; }
        .btn-red { background: var(--accent-red); color: #000; }

        .list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

        .list-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title { font-weight: bold; font-size: 0.95rem; }
        .item-sub { font-size: 0.8rem; color: var(--text-muted); }

        .countdown-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⏱️ Eric's Study & Exam Tracker</h1>
        <a href="/">← Main Portfolio</a>
    </header>

    <div class="dashboard">
        <div class="card">
            <div class="card-title">📚 Active Study Session</div>

            <select id="projectSelect"></select>

            <div class="timer-display">
                <div class="timer-time" id="timerDisplay">00:00:00</div>
                <div class="timer-controls">
                    <button id="startBtn" class="btn-green">Start</button>
                    <button id="stopBtn" class="btn-red" style="display: none;">Stop</button>
                    <button id="resetBtn" style="background: var(--border); color: var(--text);">Reset</button>
                </div>
            </div>

            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: bold;">TOTAL TIME LOGGED</div>
            <ul class="list" id="projectList"></ul>
        </div>

        <div class="card">
            <div class="card-title">🎯 Upcoming Exams</div>
            <ul class="list" id="examList"></ul>
        </div>
    </div>

    <script>
        const ERIC_PROJECTS = [
            { id: "1", name: "Flight Dynamics & Controls", totalHours: 24.5 },
            { id: "2", name: "Orbital Mechanics", totalHours: 18.0 },
            { id: "3", name: "NASA USLI Payload Development", totalHours: 42.0 }
        ];

        const ERIC_EXAMS = [
            { name: "Flight Dynamics Midterm", date: "2026-10-28T14:00:00" },
            { name: "Orbital Mechanics Exam 1", date: "2026-11-12T09:30:00" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const projectSelect = document.getElementById('projectSelect');
            const projectList = document.getElementById('projectList');
            const examList = document.getElementById('examList');
            const timerDisplay = document.getElementById('timerDisplay');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const resetBtn = document.getElementById('resetBtn');

            let timerInterval = null;
            let elapsedSeconds = 0;

            function renderProjects() {
                if (!projectSelect || !projectList) return;
                projectSelect.innerHTML = '';
                projectList.innerHTML = '';

                ERIC_PROJECTS.forEach(proj => {
                    const opt = document.createElement('option');
                    opt.value = proj.id;
                    opt.textContent = proj.name;
                    projectSelect.appendChild(opt);

                    const li = document.createElement('li');
                    li.className = 'list-item';
                    li.innerHTML = `
                        <span class="item-title">${proj.name}</span>
                        <span class="item-sub" style="font-weight: bold; color: var(--accent-cyan);">${proj.totalHours.toFixed(1)} hrs</span>
                    `;
                    projectList.appendChild(li);
                });
            }

            function renderExams() {
                if (!examList) return;
                examList.innerHTML = '';
                const now = new Date().getTime();

                const sortedExams = [...ERIC_EXAMS].sort((a, b) => new Date(a.date) - new Date(b.date));

                sortedExams.forEach(exam => {
                    const examTime = new Date(exam.date).getTime();
                    const diffMs = examTime - now;

                    let countdownText = "";
                    if (diffMs <= 0) {
                        countdownText = "Completed";
                    } else {
                        const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        countdownText = `${days}d ${hours}h left`;
                    }

                    const dateFormatted = new Date(exam.date).toLocaleString([], {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    const li = document.createElement('li');
                    li.className = 'list-item';
                    li.innerHTML = `
                        <div>
                            <div class="item-title">${exam.name}</div>
                            <div class="item-sub">${dateFormatted}</div>
                        </div>
                        <span class="countdown-badge">${countdownText}</span>
                    `;
                    examList.appendChild(li);
                });
            }

            function formatHMS(sec) {
                const h = Math.floor(sec / 3600).toString().padStart(2, '0');
                const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
                const s = (sec % 60).toString().padStart(2, '0');
                return `${h}:${m}:${s}`;
            }

            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    startBtn.style.display = 'none';
                    if (stopBtn) stopBtn.style.display = 'inline-block';
                    timerInterval = setInterval(() => {
                        elapsedSeconds++;
                        if (timerDisplay) timerDisplay.textContent = formatHMS(elapsedSeconds);
                    }, 1000);
                });
            }

            if (stopBtn) {
                stopBtn.addEventListener('click', () => {
                    clearInterval(timerInterval);
                    if (startBtn) startBtn.style.display = 'inline-block';
                    stopBtn.style.display = 'none';
                });
            }

            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    clearInterval(timerInterval);
                    elapsedSeconds = 0;
                    if (timerDisplay) timerDisplay.textContent = '00:00:00';
                    if (startBtn) startBtn.style.display = 'inline-block';
                    if (stopBtn) stopBtn.style.display = 'none';
                });
            }

            renderProjects();
            renderExams();
        });
    </script>
</body>
</html>
